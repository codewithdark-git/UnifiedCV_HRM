[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ihrm"
version = "1.0.0"
description = "I-HRM: Image Hierarchical Reasoning Model - Hierarchical Vision Transformer with Adaptive Halting"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ahsan Umar", email = "ahsan.umar@icup.edu.pk"}
]
keywords = [
    "computer-vision",
    "transformer",
    "hierarchical-reasoning",
    "adaptive-computation",
    "mixture-of-experts",
    "vision-transformer",
    "pytorch",
    "huggingface"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "huggingface-hub>=0.22.0",
    "safetensors>=0.4.0",
    "datasets>=2.18.0",
    "timm>=1.0.0",
    "fvcore>=0.1.5",
    "thop>=0.1.1",
    "pyyaml>=6.0.1",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "opencv-python>=4.9.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "pandas>=2.1.0",
    "wandb>=0.16.0",
    "tensorboard>=2.15.0",
    "einops>=0.7.0",
    "pycocotools>=2.0.7",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=1.3.0",
]
paper = [
    "latex>=0.1.0",
    "pylatex>=2.5.0",
]
lion = ["lion-pytorch>=0.1.2"]
bitsandbytes = ["bitsandbytes>=0.43.0"]

[project.urls]
Homepage = "https://github.com/yourusername/I-HRM"
Repository = "https://github.com/yourusername/I-HRM"
Documentation = "https://github.com/yourusername/I-HRM/docs"
Issues = "https://github.com/yourusername/I-HRM/issues"

[project.scripts]
ihrm = "src.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "ANN", "T20", "SIM", "RET"]
ignore = ["E501", "B008", "C901", "T201", "ANN101", "ANN102", "SIM103"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true