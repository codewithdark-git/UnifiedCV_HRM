# Training Configurations

# Quick Debug (1 epoch, small batch, synthetic)
quick_debug:
  epochs: 1
  batch_size: 4
  gradient_accumulation_steps: 1
  max_steps: null
  optimizer: "adamw"
  lr: 0.0001
  weight_decay: 0.05
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  scheduler: "cosine_warmup"
  warmup_epochs: 0
  warmup_start_lr: 1e-6
  min_lr: 1e-6
  step_size: 30
  gamma: 0.1
  grad_clip: 1.0
  label_smoothing: 0.1
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  precision: "fp32"
  bf16: false
  distributed_backend: "none"
  log_interval: 10
  log_level: "DEBUG"
  use_wandb: false
  use_tensorboard: false
  eval_interval: 1
  save_interval: 1
  save_best_only: false
  save_last: true
  max_keep_ckpts: 1
  checkpoint_dir: "./checkpoints"
  resume_from: null
  push_to_hub: false
  seed: 42
  deterministic: false
  benchmark: true
  early_stopping: false
  early_stopping_patience: 10
  early_stopping_metric: "val_loss"
  early_stopping_mode: "min"
  halt_loss_weight: 0.1

# CIFAR-100 Paper Config
cifar100_paper:
  epochs: 300
  batch_size: 128
  gradient_accumulation_steps: 1
  optimizer: "adamw"
  lr: 0.0003
  weight_decay: 0.05
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  scheduler: "cosine_warmup"
  warmup_epochs: 20
  warmup_start_lr: 1e-6
  min_lr: 1e-6
  step_size: 30
  gamma: 0.1
  grad_clip: 1.0
  label_smoothing: 0.1
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  precision: "fp16"
  bf16: false
  distributed_backend: "none"
  log_interval: 50
  log_level: "INFO"
  use_wandb: true
  wandb_project: "ihrm-cifar100"
  use_tensorboard: true
  tensorboard_dir: "./logs/tb"
  eval_interval: 1
  eval_batch_size: 128
  save_interval: 10
  save_best_only: true
  save_last: true
  max_keep_ckpts: 5
  checkpoint_dir: "./checkpoints/cifar100"
  resume_from: null
  push_to_hub: false
  seed: 42
  deterministic: false
  benchmark: true
  early_stopping: false
  early_stopping_patience: 20
  early_stopping_metric: "val_accuracy"
  early_stopping_mode: "max"
  halt_loss_weight: 0.1

# ImageNet-1K Paper Config (DDP, 8 GPUs)
imagenet1k_paper:
  epochs: 100
  batch_size: 32
  gradient_accumulation_steps: 8
  optimizer: "adamw"
  lr: 0.0003
  weight_decay: 0.05
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  scheduler: "cosine_warmup"
  warmup_epochs: 20
  warmup_start_lr: 1e-6
  min_lr: 1e-6
  step_size: 30
  gamma: 0.1
  grad_clip: 1.0
  label_smoothing: 0.1
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  precision: "fp16"
  bf16: true
  distributed_backend: "ddp"
  log_interval: 100
  log_level: "INFO"
  use_wandb: true
  wandb_project: "ihrm-imagenet1k"
  use_tensorboard: true
  tensorboard_dir: "./logs/tb/imagenet1k"
  eval_interval: 1
  eval_batch_size: 64
  save_interval: 5
  save_best_only: true
  save_last: true
  max_keep_ckpts: 3
  checkpoint_dir: "./checkpoints/imagenet1k"
  resume_from: null
  push_to_hub: true
  hub_repo_id: "user/ihrm-imagenet1k"
  hub_token: null
  hub_private: true
  hub_commit_every: 5
  seed: 42
  deterministic: false
  benchmark: true
  early_stopping: false
  early_stopping_patience: 10
  early_stopping_metric: "val_loss"
  early_stopping_mode: "min"
  halt_loss_weight: 0.1

