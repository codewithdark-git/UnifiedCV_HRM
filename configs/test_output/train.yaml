train:
  batch_size: 32
  benchmark: true
  beta1: 0.9
  beta2: 0.999
  bf16: false
  checkpoint_dir: ./checkpoints
  compile: false
  cutmix_alpha: 0.0
  ddp_find_unused_parameters: false
  deterministic: false
  distributed: null
  distributed_backend: !!python/object/apply:src.config.train_config.DistributedBackend
  - none
  early_stopping: false
  early_stopping_metric: val_loss
  early_stopping_mode: min
  early_stopping_patience: 10
  epochs: 100
  eps: 1.0e-08
  eval_batch_size: 32
  eval_interval: 1
  fsdp_sharding_strategy: FULL_SHARD
  gamma: 0.1
  grad_clip: 1.0
  gradient_accumulation_steps: 1
  halt_loss_weight: 0.1
  hub_commit_every: 1
  hub_private: false
  hub_repo_id: null
  hub_token: null
  label_smoothing: 0.1
  log_dir: ./logs
  log_interval: 50
  log_level: INFO
  lr: 0.0003
  max_keep_ckpts: 5
  max_steps: null
  min_lr: 1.0e-06
  mixup_alpha: 0.0
  num_workers: 8
  optimizer: adamw
  output_dir: ./outputs
  pin_memory: true
  precision: fp16
  push_to_hub: false
  resume_from: null
  save_best_only: true
  save_interval: 10
  save_last: true
  scheduler: cosine_warmup
  seed: 42
  step_size: 30
  tensorboard_dir: ./logs/tensorboard
  use_tensorboard: true
  use_wandb: false
  wandb: false
  wandb_entity: null
  wandb_project: unifiedcv-hrm
  wandb_run: null
  wandb_tags: []
  warmup_epochs: 20
  warmup_start_lr: 1.0e-06
  weight_decay: 0.05
