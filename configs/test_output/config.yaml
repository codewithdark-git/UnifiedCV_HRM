data:
  aug_strength: standard
  augment: true
  batch_size: 32
  clahe_clip_limit: 2.0
  clahe_tile_grid: !!python/tuple
  - 8
  - 8
  class_names: null
  cutmix_alpha: 0.0
  display_name: default
  drop_last: true
  frame_sample_rate: 1
  hf_config: null
  hf_repo_id: null
  hf_split_mapping:
    test: test
    train: train
    val: validation
  image_size: 224
  image_size_val: 224
  is_multi_label: false
  mean: !!python/tuple
  - 0.485
  - 0.456
  - 0.406
  mixup_alpha: 0.0
  name: default
  num_classes: 1000
  num_frames: 8
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
  rand_augment: false
  root_dir: null
  shuffle_train: true
  source: local
  std: !!python/tuple
  - 0.229
  - 0.224
  - 0.225
  task: classification
  test_subdir: test
  train_subdir: train
  tv_dataset_name: null
  tv_root: null
  use_clahe: false
  val_subdir: val
model:
  architectures:
  - UnifiedCVHRM
  attention_type: dsa
  causal: false
  det_num_classes: 80
  det_num_proposals: 100
  dsa_window: 7
  ffn_expansion: 4.0
  ffn_type: moe
  halt_loss_weight: 0.1
  halt_threshold: 0.5
  hidden_size: 256
  image_size: 224
  in_channels: 3
  init_std: 0.02
  max_steps: 6
  model_type: unified_cv_hrm
  moe_num_experts: 8
  moe_routing: dense
  moe_top_k: 2
  norm_eps: 1.0e-05
  num_classes: 1000
  num_frames: 8
  num_heads: 8
  num_layers_per_stream: 2
  patch_size: 16
  seg_num_classes: 80
  task: classification
  use_cls_token: true
  use_pos_embed: true
  use_rmsnorm: true
  use_rotary: false
  video_patch_size: !!python/tuple
  - 2
  - 4
  - 4
train:
  batch_size: 32
  benchmark: true
  beta1: 0.9
  beta2: 0.999
  bf16: false
  checkpoint_dir: ./checkpoints
  compile: false
  cutmix_alpha: 0.0
  ddp_find_unused_parameters: false
  deterministic: false
  distributed: null
  distributed_backend: !!python/object/apply:src.config.train_config.DistributedBackend
  - none
  early_stopping: false
  early_stopping_metric: val_loss
  early_stopping_mode: min
  early_stopping_patience: 10
  epochs: 100
  eps: 1.0e-08
  eval_batch_size: 32
  eval_interval: 1
  fsdp_sharding_strategy: FULL_SHARD
  gamma: 0.1
  grad_clip: 1.0
  gradient_accumulation_steps: 1
  halt_loss_weight: 0.1
  hub_commit_every: 1
  hub_private: false
  hub_repo_id: null
  hub_token: null
  label_smoothing: 0.1
  log_dir: ./logs
  log_interval: 50
  log_level: INFO
  lr: 0.0003
  max_keep_ckpts: 5
  max_steps: null
  min_lr: 1.0e-06
  mixup_alpha: 0.0
  num_workers: 8
  optimizer: adamw
  output_dir: ./outputs
  pin_memory: true
  precision: fp16
  push_to_hub: false
  resume_from: null
  save_best_only: true
  save_interval: 10
  save_last: true
  scheduler: cosine_warmup
  seed: 42
  step_size: 30
  tensorboard_dir: ./logs/tensorboard
  use_tensorboard: true
  use_wandb: false
  wandb: false
  wandb_entity: null
  wandb_project: unifiedcv-hrm
  wandb_run: null
  wandb_tags: []
  warmup_epochs: 20
  warmup_start_lr: 1.0e-06
  weight_decay: 0.05
