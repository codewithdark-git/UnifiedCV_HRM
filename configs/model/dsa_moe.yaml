# I-HRM Model Configurations

# Paper Base (DSA + MoE, D=384, H=8, p=16)
model_base:
  hidden_size: 384
  num_heads: 8
  num_layers_per_stream: 2
  max_steps: 6
  halt_threshold: 0.5
  halt_loss_weight: 0.1
  attention_type: "dsa"
  dsa_window: 7
  ffn_type: "moe"
  ffn_expansion: 4.0
  moe_num_experts: 8
  moe_routing: "dense"
  image_size: 224
  patch_size: 16
  in_channels: 3
  use_cls_token: true
  use_pos_embed: true
  num_frames: 8
  video_patch_size: [2, 4, 4]
  task: "classification"
  num_classes: 1000
  seg_num_classes: 80
  det_num_classes: 80
  det_num_proposals: 100
  init_std: 0.02
  norm_eps: 1e-5
  use_rmsnorm: true

